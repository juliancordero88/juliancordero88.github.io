version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - api/.env
    volumes:
      # Hot-reload in development
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
