[project]
name            = "trademark-clearance-engine"
version         = "1.0.0"
description     = "Programmatic trademark clearance: phonetic/visual/conceptual similarity, USPTO + EUIPO search, DuPont risk scoring, common-law checking"
authors         = [{name = "Julian Cordero"}]
requires-python = ">=3.11"
license         = {text = "MIT"}

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "httpx>=0.26.0",
  "jellyfish>=1.0.0",
  "abydos>=0.5.0",
  "rapidfuzz>=3.6.0",
  "sentence-transformers>=2.4.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
trademark-engine = "main:app"

[tool.pytest.ini_options]
testpaths = ["api/tests"]
